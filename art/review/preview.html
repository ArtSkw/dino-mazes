<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Mazes — source art inspection</title>
<style>body{margin:24px;background:#f4edda;color:#203629;font:16px system-ui}h1{font-size:24px}p{max-width:800px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}article{background:#fff9ea;padding:16px;border-radius:16px}img{width:100%;height:auto}article.dark{background:#153526;color:white}button{padding:12px 18px;margin:0 10px 20px 0;font:inherit}</style>
<h1>Dino Mazes — source art inspection</h1><p>Generated source candidates. These are not game screenshots or approved runtime atlases. View on both backgrounds to check transparency. Claude Code owns extraction, frame registration and final animation QA.</p><button onclick="document.querySelectorAll('article').forEach(x=>x.classList.toggle('dark'))">Toggle dark background</button><section id="art"></section>
<h2>First-frame inspection at 180 CSS pixels</h2><section id="frames"></section>
<script>
const entries=['character-bill-v2','character-tiny-v1','character-mazu-v1','character-rocky-v1','character-giganto-v2','treasure-kit-v1','jungle-backdrop-v1','ground-plate-v1','foliage-kit-v1','collection-background-v1','ui-surfaces-v1'];
for(const name of entries){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=name;h.style.fontSize='16px';const im=document.createElement('img');im.src='../source/'+name+'.png';im.alt=name;im.onerror=()=>a.hidden=true;a.append(h,im);document.getElementById('art').append(a);if(name.startsWith('character-')){const cell=document.createElement('article');const label=document.createElement('p');label.textContent=name;const frame=document.createElement('div');frame.style.cssText='width:180px;height:180px;background-image:url(../source/'+name+'.png);background-size:720px 720px;background-repeat:no-repeat';cell.append(label,frame);document.getElementById('frames').append(cell)}}
</script></html>
