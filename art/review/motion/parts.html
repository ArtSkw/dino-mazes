<!doctype html><html lang="pl"><meta charset="utf-8"><title>Dino Mazes — kontrola części</title><style>body{background:#162f29;color:#fff3d4;font:17px system-ui;margin:28px}select,button{font:inherit;padding:9px;border-radius:12px;background:#fff3d4;color:#203f35;border:0;margin-right:10px}img{max-width:100%;border-radius:12px}section{max-width:1100px;margin:auto}.pair{display:flex;gap:12px}.pair img{width:calc(50% - 12px);background:#fff3d4}p{line-height:1.5}h1{font-size:26px}#frames{width:100%}#animation{width:720px}a{color:#f8d48a}</style><section><h1>Kontrola warstw i ruchu</h1><p>Po lewej tło kremowe, po prawej zielone. Ruch pokazuje pełny zakres testowy — nie docelowe tempo gry. Warstwy są generowanym przybliżeniem obrazu-matki.</p><select id="asset" aria-label="Skarb"><option>butterfly</option><option>coconut</option><option>nut</option><option>flower</option><option>berries</option><option>chest</option><option>strawberry</option></select><select id="mode" aria-label="Tryb"><option value="stress">Ruch testowy</option><option value="bloom">Rozkwitanie (kwiat)</option></select><button id="pause">Zatrzymaj</button><p id="note"></p><img id="animation" alt="Animacja na dwóch tłach"><h2>Cztery fazy ruchu</h2><img id="frames" alt="Fazy skrajne"><h2>Obraz-matka / złożone warstwy</h2><div class="pair"><img id="master" alt="Zatwierdzony obraz-matka"><img id="assembled" alt="Warstwy po dopasowaniu"></div><p><a href="parts-comparison.png">Pełne porównanie</a> · <a href="registration.json">Punkty obrotu i kolejność</a></p></section><script>
const $=s=>document.querySelector(s);let paused=false;
const notes={butterfly:'Skrzydła: 100% → 20% szerokości wokół nasady.',coconut:'Korpus ±20°, kosmyk ±10°, refleks nieruchomy.',nut:'Orzech unosi się o 6% wysokości płótna.',flower:'Płatki ±5°; osobny test rozkwitania do 30% skali.',berries:'Każda jagoda 85–115% skali.',chest:'Wieko od 0 do −15°; osobna poza open.png do nagrody.',strawberry:'Korona ±6°, refleks nieruchomy; skok całego skarbu wdraża Claude.'};
function update(){const a=$('#asset').value;const mode=a==='flower'?$('#mode').value:'stress';$('#note').textContent=notes[a];$('#animation').src=a+'-'+mode+(paused?'.png':'.gif');$('#frames').src=a+'-'+mode+'.png';$('#master').src='../../source/motion/'+a+'/master.png';$('#assembled').src=a+'-assembled.png';}
$('#asset').onchange=update;$('#mode').onchange=update;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Odtwórz':'Zatrzymaj';update()};update();
</script></html>
